    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Aman Azad",
      "jobTitle": "Software Engineer",
      "description": "Software Engineer specializing in full-stack engineering, backend systems, and AI/LLM applications",

        "https://github.com/amanazads",
        "https://linkedin.com/in/amanazads"

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Anti-FOUC theme script: runs before React to prevent flash -->
    <script>
      (function() {
        var stored = localStorage.getItem('aman-azad-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
